<table ng-attr-aria-busy="{{loading}}">
    <thead><tr>
        <th><button type="button" ng-click="sort('id')" ng-disabled="loading">Id{{indicator('id')}}</button></th>
        <th><button type="button" ng-click="sort('task')" ng-disabled="loading">Task{{indicator('task')}}</button></th>
        <th><button type="button" ng-click="sort('createdDate')" ng-disabled="loading">Created Date{{indicator('createdDate')}}</button></th>
    </tr></thead>
    <tbody ng-if="loading"><tr><td colspan="3" role="status">Loading...</td></tr></tbody>
    <tbody ng-if="!loading && error"><tr><td colspan="3" role="alert">{{error}} <button type="button" ng-click="load()">Retry</button></td></tr></tbody>
    <tbody ng-if="!loading && !error">
        <tr ng-repeat="todo in todos track by todo.id">
            <td>{{todo.id}}</td><td>{{todo.task}}</td><td>{{todo.createdDate | date:'MM/dd/yyyy'}}</td>
        </tr>
        <tr ng-if="!todos.length"><td colspan="3">No tasks found.</td></tr>
    </tbody>
</table>
<pagination page="page" page-size="pageSize" total-pages="totalPages" total-items="totalItems"
            busy="loading" on-change="load(page, pageSize)"></pagination>
