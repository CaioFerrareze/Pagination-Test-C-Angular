<div class="pagination">
    <div>
        <label>Items per page
            <select ng-model="pageSize" ng-options="size as (size === 0 ? 'all' : size) for size in sizes"
                    ng-change="resize()" ng-disabled="busy"></select>
        </label>
    </div>
    <div>
        <button type="button" ng-click="go(1)" ng-disabled="busy || page <= 1" aria-label="First page">&lt;&lt;</button>
        <button type="button" ng-click="go(page - 1)" ng-disabled="busy || page <= 1" aria-label="Previous page">&lt;</button>
        <label>Page <input type="number" ng-model="inputPage" ng-change="go(inputPage)"
            ng-model-options="{ allowInvalid: true }" min="1" max="{{totalPages}}" step="1" ng-disabled="busy" /></label>
        of {{totalPages}}
        <button type="button" ng-click="go(page + 1)" ng-disabled="busy || page >= totalPages" aria-label="Next page">&gt;</button>
        <button type="button" ng-click="go(totalPages)" ng-disabled="busy || page >= totalPages" aria-label="Last page">&gt;&gt;</button>
    </div>
    <div><span>{{totalItems}} items</span></div>
</div>
